name: E2E

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - edited
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  APP_TIMEZONE: UTC
  DATABASE_URL: postgresql://lingo_pilot:lingo_pilot_ci@127.0.0.1:5435/lingo_pilot_runtime
  TEST_DATABASE_URL: postgresql://lingo_pilot:lingo_pilot_ci@127.0.0.1:5435/lingo_pilot_test

jobs:
  e2e:
    name: e2e
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e') ||
      contains(github.event.pull_request.title, '[e2e]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lingo_pilot_test
          POSTGRES_PASSWORD: lingo_pilot_ci
          POSTGRES_USER: lingo_pilot
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U lingo_pilot -d lingo_pilot_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable repository package manager
        shell: bash
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser validation
        run: pnpm test:e2e
