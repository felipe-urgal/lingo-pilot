name: Temporary DB artifacts

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/postgres-drizzle-foundation

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/postgres-drizzle-foundation

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable repository package manager
        shell: bash
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Install and generate artifacts
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @lingo-pilot/db exec drizzle-kit generate --name=foundation_schema

      - name: Commit generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml packages/db/drizzle
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: generate database artifacts"
          git push origin HEAD:feature/postgres-drizzle-foundation
