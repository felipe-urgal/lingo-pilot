name: PR 86 hardening

on:
  push:
    branches:
      - feature/21-24-practice-learning-loop

permissions:
  contents: write

env:
  CI: true
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:5400
  APP_TIMEZONE: UTC
  DATABASE_URL: postgresql://lingo_pilot:lingo_pilot@127.0.0.1:5435/lingo_pilot_runtime
  TEST_DATABASE_URL: postgresql://lingo_pilot:lingo_pilot@127.0.0.1:5435/lingo_pilot_test
  LINGO_TEST_MODE: false

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/21-24-practice-learning-loop

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: true

      - name: Enable repository package manager
        shell: bash
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply retry and state hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/db/src/repositories/postgres-practice-repository.ts')
          text = path.read_text()
          anchor = '''  constructor(database: Database) {\n    this.database = database;\n  }\n\n  async submitAttempt('''
          replacement = '''  constructor(database: Database) {\n    this.database = database;\n  }\n\n  async findAttemptByOperation(\n    enrollmentId: string,\n    operationKey: string,\n  ): Promise<ActivityAttempt | null> {\n    const row = await findAttemptByOperation(\n      this.database,\n      enrollmentId,\n      operationKey,\n    );\n    return row ? attemptFromRow(row) : null;\n  }\n\n  async submitAttempt('''
          if anchor not in text:
              raise SystemExit('postgres attempt anchor missing')
          text = text.replace(anchor, replacement, 1)

          anchor = '''  async recordReview(\n    input: RecordReviewInput,'''
          replacement = '''  async findReviewByOperation(\n    enrollmentId: string,\n    operationKey: string,\n  ): Promise<ReviewEvent | null> {\n    const row = await findReviewByOperation(\n      this.database,\n      enrollmentId,\n      operationKey,\n    );\n    return row ? reviewFromRow(row) : null;\n  }\n\n  async recordReview(\n    input: RecordReviewInput,'''
          if anchor not in text:
              raise SystemExit('postgres review anchor missing')
          text = text.replace(anchor, replacement, 1)
          path.write_text(text)

          path = Path('apps/web/server/application/submit-activity-attempt.ts')
          text = path.read_text()
          anchor = '''    const activity = getPracticeActivity(\n      dependencies.catalog,\n      input.activityId,\n    );'''
          replacement = '''    const duplicate = await dependencies.practice.findAttemptByOperation(\n      input.journey.enrollment.id,\n      input.operationKey,\n    );\n    if (duplicate) {\n      return {\n        ok: true,\n        attemptId: duplicate.id,\n        correct: duplicate.evaluation.correct,\n        scorePercent: duplicate.evaluation.scorePercent,\n        duplicate: true,\n      };\n    }\n\n    const activity = getPracticeActivity(\n      dependencies.catalog,\n      input.activityId,\n    );'''
          if anchor not in text:
              raise SystemExit('submit attempt duplicate anchor missing')
          text = text.replace(anchor, replacement, 1)
          anchor = '''    if (!session || !item || session.status === "abandoned") {\n      return { ok: false, reason: "invalid-reference" };\n    }'''
          replacement = '''    if (\n      !session ||\n      !item ||\n      session.status !== "in_progress" ||\n      item.status !== "in_progress"\n    ) {\n      return { ok: false, reason: "invalid-reference" };\n    }'''
          if anchor not in text:
              raise SystemExit('submit attempt state anchor missing')
          text = text.replace(anchor, replacement, 1)
          path.write_text(text)

          path = Path('apps/web/server/application/submit-review.ts')
          text = path.read_text()
          anchor = '''    const now = dependencies.clock.now();'''
          replacement = '''    const duplicate = await dependencies.practice.findReviewByOperation(\n      input.journey.enrollment.id,\n      input.operationKey,\n    );\n    if (duplicate) {\n      return {\n        ok: true,\n        reviewEventId: duplicate.id,\n        correct: duplicate.correct,\n        grade: duplicate.grade,\n        nextDueAt: duplicate.nextDueAt,\n        duplicate: true,\n      };\n    }\n\n    const now = dependencies.clock.now();'''
          if anchor not in text:
              raise SystemExit('submit review duplicate anchor missing')
          text = text.replace(anchor, replacement, 1)
          path.write_text(text)
          PY

      - name: Format and typecheck
        run: |
          pnpm format
          pnpm format:check
          pnpm typecheck

      - name: Commit hardening and remove helper
        shell: bash
        run: |
          git rm .github/workflows/pr-86-hardening.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve practice idempotency across retries"
          git push origin HEAD:feature/21-24-practice-learning-loop
