name: Refresh design system formatting

on:
  push:
    branches:
      - feature/design-system-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/design-system-foundation

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable repository package manager
        shell: bash
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format design system files
        run: >-
          pnpm exec prettier --write
          apps/web/app/app/design-system/page.tsx
          apps/web/test/ui-primitives.component.test.tsx
          packages/ui/src/field.tsx
          packages/ui/src/index.ts
          packages/ui/src/styles.css

      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/app/design-system/page.tsx apps/web/test/ui-primitives.component.test.tsx packages/ui/src/field.tsx packages/ui/src/index.ts packages/ui/src/styles.css
          git commit -m "style: format design system foundation"
          git push origin HEAD:feature/design-system-foundation
