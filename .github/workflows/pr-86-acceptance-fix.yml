name: PR 86 acceptance fix
on:
  push:
    branches:
      - feature/21-24-practice-learning-loop
permissions:
  contents: write
env:
  CI: true
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:5400
  APP_TIMEZONE: UTC
  DATABASE_URL: postgresql://lingo_pilot:lingo_pilot@127.0.0.1:5435/lingo_pilot_runtime
  TEST_DATABASE_URL: postgresql://lingo_pilot:lingo_pilot@127.0.0.1:5435/lingo_pilot_test
  LINGO_TEST_MODE: false
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/21-24-practice-learning-loop
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: true
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('packages/db/src/repositories/postgres-practice-repository.ts')
          s = p.read_text()
          old = """    return this.database.transaction(async (transaction) => {\n      const duplicate = await findAttemptByOperation("""
          new = """    return this.database.transaction(async (transaction) => {\n      await transaction.execute(\n        sql`select pg_advisory_xact_lock(hashtext(${input.enrollmentId}), hashtext(${input.activityId}))`,\n      );\n\n      const duplicate = await findAttemptByOperation("""
          if old not in s: raise SystemExit('submit anchor missing')
          s = s.replace(old, new, 1)
          old = """      if (\n        input.sessionItemId &&\n        !(await ownsSessionItem(\n          transaction,\n          input.enrollmentId,\n          input.sessionItemId,\n        ))\n      ) {\n        return { ok: false, reason: \"not-found\" };\n      }\n\n      const [created] = await transaction"""
          new = """      if (\n        input.sessionItemId &&\n        !(await ownsSessionItem(\n          transaction,\n          input.enrollmentId,\n          input.sessionItemId,\n        ))\n      ) {\n        return { ok: false, reason: \"not-found\" };\n      }\n\n      const maxAttempts = Math.max(1, Math.trunc(input.maxAttempts));\n      const [progress] = await transaction\n        .select({ attempts: activityProgress.attempts })\n        .from(activityProgress)\n        .where(\n          and(\n            eq(activityProgress.enrollmentId, input.enrollmentId),\n            eq(activityProgress.activityId, input.activityId),\n          ),\n        )\n        .limit(1);\n      if ((progress?.attempts ?? 0) >= maxAttempts) {\n        return { ok: false, reason: \"retry-limit\" };\n      }\n\n      const [created] = await transaction"""
          if old not in s: raise SystemExit('limit anchor missing')
          s = s.replace(old, new, 1)
          old = """    limit: number,\n  ): Promise<readonly DueReviewItem[]> {\n    const safeLimit = Math.min(100, Math.max(1, Math.trunc(limit)));"""
          new = """    limit: number,\n    offset = 0,\n  ): Promise<readonly DueReviewItem[]> {\n    const safeLimit = Math.min(100, Math.max(1, Math.trunc(limit)));\n    const safeOffset = Math.max(0, Math.trunc(offset));"""
          if old not in s: raise SystemExit('pagination signature anchor missing')
          s = s.replace(old, new, 1)
          old = """      .orderBy(asc(memoryItems.dueAt), asc(memoryItems.id))\n      .limit(safeLimit);"""
          new = """      .orderBy(asc(memoryItems.dueAt), asc(memoryItems.id))\n      .limit(safeLimit)\n      .offset(safeOffset);"""
          if old not in s: raise SystemExit('pagination query anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('apps/web/server/application/submit-activity-attempt.ts')
          s = p.read_text()
          s = s.replace(
            'export type SubmitActivityAttemptError =\n  "invalid-input" | "invalid-reference" | "content-unavailable";',
            'export type SubmitActivityAttemptError =\n  | "invalid-input"\n  | "invalid-reference"\n  | "content-unavailable"\n  | "retry-limit";',
            1,
          )
          s = s.replace(
            '        operationKey: input.operationKey,\n        answer: input.answer,',
            '        operationKey: input.operationKey,\n        maxAttempts: activity.maxAttempts,\n        answer: input.answer,',
            1,
          )
          s = s.replace(
            '    if (!persisted.ok) return { ok: false, reason: "invalid-reference" };',
            '    if (!persisted.ok) {\n      return {\n        ok: false,\n        reason:\n          persisted.reason === "retry-limit"\n            ? "retry-limit"\n            : "invalid-reference",\n      };\n    }',
            1,
          )
          p.write_text(s)

          p = Path('packages/db/src/practice-schema.ts')
          s = p.read_text().replace(
            '.references(() => memoryItems.id, { onDelete: "cascade" }),',
            '.references(() => memoryItems.id, { onDelete: "restrict" }),',
            1,
          )
          p.write_text(s)

          p = Path('packages/db/drizzle/0004_practice_learning_loop.sql')
          s = p.read_text().replace(
            'REFERENCES "public"."memory_items"("id") ON DELETE cascade ON UPDATE no action;',
            'REFERENCES "public"."memory_items"("id") ON DELETE restrict ON UPDATE no action;',
            1,
          )
          p.write_text(s)

          p = Path('packages/db/test/practice-learning.integration.test.mjs')
          s = p.read_text().replace(
            '    operationKey: `attempt-op-${suffix}`,\n    answer: "understood",',
            '    operationKey: `attempt-op-${suffix}`,\n    maxAttempts: 3,\n    answer: "understood",',
            1,
          )
          if 'enforces configured retry limit before creating additional evidence' not in s:
            s += '''\n\ntest("enforces configured retry limit before creating additional evidence", async () => {\n  const enrollmentId = await createEnrollment();\n  const repository = new PostgresPracticeRepository(client.db);\n  const activityId = `activity.retry-limit-${randomUUID()}`;\n  const conceptId = `concept.retry-limit-${randomUUID()}`;\n\n  for (let index = 0; index < 3; index += 1) {\n    const result = await repository.submitAttempt(\n      attemptInput(enrollmentId, {\n        activityId,\n        conceptIds: [conceptId],\n        initialMemorySchedules: [{\n          conceptId,\n          memoryItemId: `memory-${randomUUID()}`,\n          dueAt: new Date("2026-09-03T13:00:00.000Z"),\n          intervalSeconds: 600,\n          algorithmVersion: "review-scheduler-v1",\n        }],\n      }),\n      reduceMastery,\n    );\n    assert.equal(result.ok, true);\n  }\n\n  const rejected = await repository.submitAttempt(\n    attemptInput(enrollmentId, {\n      activityId,\n      conceptIds: [conceptId],\n      initialMemorySchedules: [{\n        conceptId,\n        memoryItemId: `memory-${randomUUID()}`,\n        dueAt: new Date("2026-09-03T13:00:00.000Z"),\n        intervalSeconds: 600,\n        algorithmVersion: "review-scheduler-v1",\n      }],\n    }),\n    reduceMastery,\n  );\n\n  assert.deepEqual(rejected, { ok: false, reason: "retry-limit" });\n  const state = await client.pool.query(\n    `select\n      (select count(*)::int from activity_attempts where enrollment_id = $1 and activity_id = $2) as attempts,\n      (select count(*)::int from concept_evidence where enrollment_id = $1 and concept_id = $3) as evidence`,\n    [enrollmentId, activityId, conceptId],\n  );\n  assert.deepEqual(state.rows[0], { attempts: 3, evidence: 3 });\n});\n\ntest("paginates the due queue in deterministic dueAt/id order", async () => {\n  const enrollmentId = await createEnrollment();\n  const repository = new PostgresPracticeRepository(client.db);\n  const dueAt = new Date("2026-09-03T13:00:00.000Z");\n\n  for (const suffix of ["a", "b"]) {\n    const conceptId = `concept.page.${suffix}.${randomUUID()}`;\n    await repository.submitAttempt(\n      attemptInput(enrollmentId, {\n        activityId: `activity.page.${suffix}.${randomUUID()}`,\n        conceptIds: [conceptId],\n        initialMemorySchedules: [{\n          conceptId,\n          memoryItemId: `memory.page.${suffix}.${randomUUID()}`,\n          dueAt,\n          intervalSeconds: 600,\n          algorithmVersion: "review-scheduler-v1",\n        }],\n      }),\n      reduceMastery,\n    );\n  }\n\n  const first = await repository.listDueReviewItems(enrollmentId, dueAt, 1, 0);\n  const second = await repository.listDueReviewItems(enrollmentId, dueAt, 1, 1);\n  assert.equal(first.length, 1);\n  assert.equal(second.length, 1);\n  assert.notEqual(first[0]?.id, second[0]?.id);\n  assert.ok((first[0]?.id ?? "") < (second[0]?.id ?? ""));\n});\n'''
          p.write_text(s)
          PY
      - name: Fast validation
        run: |
          pnpm format
          pnpm format:check
          pnpm typecheck
          pnpm test:unit
      - name: Commit changes
        run: |
          git rm .github/workflows/pr-86-acceptance-fix.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: enforce practice retry and history invariants"
          git push origin HEAD:feature/21-24-practice-learning-loop
