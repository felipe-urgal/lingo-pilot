name: PR 86 docs

on:
  push:
    branches:
      - feature/21-24-practice-learning-loop

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/21-24-practice-learning-loop
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: true
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/pr86-doc-sync.py
      - run: |
          pnpm format
          pnpm format:check
      - name: Commit docs and cleanup
        run: |
          git rm .github/workflows/pr-86-doc-run.yml scripts/pr86-doc-sync.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: synchronize practice learning loop contracts"
          git push origin HEAD:feature/21-24-practice-learning-loop
