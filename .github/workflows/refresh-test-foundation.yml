name: Refresh test foundation

on:
  push:
    branches:
      - test/foundation-test-infrastructure

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable repository package manager
        shell: bash
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Update post-merge documentation state
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replace(path, from, to) {
            const current = fs.readFileSync(path, 'utf8');
            if (!current.includes(from)) {
              throw new Error(`Expected text not found in ${path}: ${from.slice(0, 80)}`);
            }
            fs.writeFileSync(path, current.replace(from, to));
          }

          replace(
            'README.md',
            'As issues #7–#11 concluíram bootstrap do monorepo/web shell, CI/governança da `main`, contrato de runtime local, foundation PostgreSQL/Drizzle e baseline de autenticação/autorização por ownership. A Foundation ainda **não está concluída**: boundaries executáveis (#12), design system (#13), observabilidade (#14), schemas de conteúdo (#15) e infraestrutura completa de testes (#16) continuam no backlog.',
            'As issues #7–#12 e #16 concluíram bootstrap do monorepo/web shell, CI/governança da `main`, contrato de runtime local, foundation PostgreSQL/Drizzle, autenticação/autorização por ownership, boundaries executáveis e infraestrutura determinística de testes. A Foundation ainda **não está concluída**: design system (#13), observabilidade (#14) e schemas de conteúdo (#15) continuam no backlog.'
          );
          replace(
            'README.md',
            'pnpm test:unit         executa testes unitários/estruturais\npnpm test:integration  executa integração via TEST_DATABASE_URL\npnpm test              executa unit + integration',
            'pnpm test:unit         executa unitários/estruturais via node:test + Vitest\npnpm test:coverage     gera coverage informativo do Vitest\npnpm test:integration  executa integração via TEST_DATABASE_URL\npnpm test:e2e          executa smoke Playwright isolado em 127.0.0.1:5401\npnpm test              executa unit + integration'
          );
          replace(
            'README.md',
            '- **Fase 0 — Foundation:** qualidade, arquitetura, CI, design system e modelos de domínio. **Em andamento; #7–#11 concluídas.**',
            '- **Fase 0 — Foundation:** qualidade, arquitetura, CI, design system e modelos de domínio. **Em andamento; #7–#12 e #16 concluídas.**'
          );

          replace(
            'docs/ISSUE_INDEX.md',
            '| #12 Establish domain/application boundaries and repository contracts | Aberta | Desbloqueada por #7 e #10 |',
            '| #12 Establish domain/application boundaries and repository contracts | Concluída | Boundaries executáveis, ports e Result/erros tipados |'
          );
          replace(
            'docs/ISSUE_INDEX.md',
            '| #16 Test infrastructure, factories and deterministic clock | Bloqueada | Depende de #12 além de #7/#10 |',
            '| #16 Test infrastructure, factories and deterministic clock | Concluída | Vitest, Testing Library, Playwright, test-support e harness PostgreSQL isolado |'
          );
          replace(
            'docs/ISSUE_INDEX.md',
            'Bootstrap, runtime, persistência e auth já foram entregues. As próximas frentes elegíveis são:\n\n```text\n#12 boundaries ─→ #16 test infrastructure\n#13 design system\n#14 observability\n#15 content schemas\n```\n\n#12, #13, #14 e #15 podem avançar conforme capacidade e dependências próprias. #16 permanece dependente de #12.',
            'Bootstrap, runtime, persistência, auth, boundaries e infraestrutura de testes já foram entregues. As próximas frentes elegíveis são:\n\n```text\n#13 design system\n#14 observability\n#15 content schemas\n```\n\n#13, #14 e #15 podem avançar conforme capacidade e dependências próprias.'
          );
          replace(
            'docs/ISSUE_INDEX.md',
            'A Foundation concluiu #7–#11. As próximas issues elegíveis são **#12, #13, #14 e #15**; a **#16** entra após #12 satisfazer sua dependência. Produção já está ativa como capability operacional, mas a #45 continua responsável pelo hardening e pelos runbooks restantes.',
            'A Foundation concluiu #7–#12 e #16. As próximas issues elegíveis são **#13, #14 e #15**. Produção já está ativa como capability operacional, mas a #45 continua responsável pelo hardening e pelos runbooks restantes.'
          );

          replace(
            'docs/LOCAL_DEVELOPMENT.md',
            'O Playwright deve usar a aplicação em `5401` por configuração explícita.\n\nO bootstrap já expõe `pnpm dev:e2e` em `5401` e o runtime profile correspondente; Playwright e a infraestrutura completa de E2E continuam responsabilidade da #16.',
            'O Playwright usa a aplicação em `5401` por configuração explícita. `pnpm test:e2e` valida `TEST_DATABASE_URL`, recria/migra somente o banco de teste e inicia `pnpm dev:e2e` com `reuseExistingServer` desabilitado. O processo de desenvolvimento em `5400` pode permanecer ativo durante a suíte.'
          );
          replace(
            'docs/LOCAL_DEVELOPMENT.md',
            '- **#16:** Playwright, isolamento E2E e suporte determinístico de testes.',
            '- **#16:** Vitest/Testing Library, Playwright em `5401`, isolamento E2E, harness PostgreSQL e suporte determinístico de testes.'
          );
          NODE

      - name: Refresh dependencies and lockfile
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Format changed foundation files
        run: >-
          pnpm exec prettier --write
          package.json apps/web/package.json packages/test-support/package.json
          vitest.config.ts playwright.config.ts apps/web/test packages/test-support/src
          scripts/run-e2e.mjs packages/db/test/support docs/TESTING.md
          docs/LOCAL_DEVELOPMENT.md docs/ISSUE_INDEX.md README.md
          .github/workflows/ci.yml pnpm-lock.yaml

      - name: Commit generated lockfile and documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml README.md docs/ISSUE_INDEX.md docs/LOCAL_DEVELOPMENT.md
          git add package.json apps/web/package.json packages/test-support/package.json
          git add vitest.config.ts playwright.config.ts apps/web/test packages/test-support/src
          git add scripts/run-e2e.mjs packages/db/test/support docs/TESTING.md .github/workflows/ci.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh test foundation lockfile and docs"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Unit and typecheck smoke
        run: |
          pnpm typecheck
          pnpm test:unit
